query:
  name: "Query AI Agent with Home Assistant context"
  description: "Run a custom AI prompt against your Home Assistant state dump."
  fields:
    prompt:
      description: "The question or instruction to send to AI model."
      example: "Turn on all the lights in the living room"
    debug:
      description: "Include a debug trace of the HA↔AI conversation (true/false)."
      example: true
      default: false
    provider:
      description: "The AI provider to use (openai, llama, gemini, openrouter, anthropic, alter, zai, local)"
      example: "openai"
      default: "openai"
      selector:
        select:
          options:
            - "openai"
            - "llama"
            - "gemini"
            - "openrouter"
            - "anthropic"
            - "alter"
            - "zai"
            - "local"

create_dashboard:
  name: "Create Dashboard via AI Agent"
  description: "Create a new Home Assistant dashboard using AI assistance."
  fields:
    dashboard_config:
      description: "The dashboard configuration as a JSON object."
      example: '{"title": "My Dashboard", "url_path": "my-dashboard", "views": []}'
    provider:
      description: "The AI provider to use (openai, llama, gemini, openrouter, anthropic, alter, zai, local)"
      example: "openai"
      default: "openai"
      selector:
        select:
          options:
            - "openai"
            - "llama"
            - "gemini"
            - "openrouter"
            - "anthropic"
            - "alter"
            - "zai"
            - "local"

create_automation:
  name: "Create Automation via AI Agent"
  description: "Create a new Home Assistant automation using AI assistance."
  fields:
    automation:
      description: "The automation configuration as a JSON object."
      example: '{"alias": "Turn off lights at 9 PM", "trigger": [{"platform": "time", "at": "21:00:00"}], "action": [{"service": "light.turn_off", "target": {"entity_id": "light.living_room"}}]}'
    provider:
      description: "The AI provider to use (openai, llama, gemini, openrouter, anthropic, alter, zai, local)"
      example: "openai"
      default: "openai"
      selector:
        select:
          options:
            - "openai"
            - "llama"
            - "gemini"
            - "openrouter"
            - "anthropic"
            - "alter"
            - "zai"
            - "local"

save_system_prompt_settings:
  name: "Save System Prompt Settings"
  description: "Save custom system prompt and/or language for the AI agent."
  fields:
    provider:
      description: "The AI provider (openai, ollama, etc.)."
      example: "ollama"
    system_prompt:
      description: "Custom system prompt (optional, empty to reset)."
      example: ""
    language:
      description: "Language for responses (e.g. German, English)."
      example: "German"

load_system_prompt_settings:
  name: "Load System Prompt Settings"
  description: "Load custom system prompt and language settings."
  fields:
    provider:
      description: "The AI provider."
      example: "ollama"

save_chat_history:
  name: "Save Chat History"
  description: "Save the current chat conversation."
  fields:
    provider:
      description: "The AI provider."
    messages:
      description: "Array of chat messages to save."

load_chat_history:
  name: "Load Chat History"
  description: "Load saved chat conversation."
  fields:
    provider:
      description: "The AI provider."

get_configured_providers:
  name: "Get Configured Providers"
  description: "Return the list of configured AI providers (for the frontend panel)."
  response:
    providers:
      description: "List of { value, label } for each configured provider."

update_dashboard:
  name: "Update Dashboard via AI Agent"
  description: "Update an existing Home Assistant dashboard using AI assistance."
  fields:
    dashboard_url:
      description: "The URL path of dashboard to update."
      example: "my-dashboard"
    dashboard_config:
      description: "The updated dashboard configuration as a JSON object."
      example: '{"title": "Updated Dashboard", "views": []}'
    provider:
      description: "The AI provider to use (openai, llama, gemini, openrouter, anthropic, alter, zai, local)"
      example: "openai"
      default: "openai"
      selector:
        select:
          options:
            - "openai"
            - "llama"
            - "gemini"
            - "openrouter"
            - "anthropic"
            - "alter"
            - "zai"
            - "local"
